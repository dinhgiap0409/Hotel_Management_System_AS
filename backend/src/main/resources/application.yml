server:
  port: 8080

spring:
  application:
    name: hms-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HMS_DB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # Uploaded room-type photos (FileStorageService). The per-file cap must
      # match app.upload.max-file-size below; the request cap covers a gallery
      # batch of up to 10 files. Oversize requests surface as 413 via
      # GlobalExceptionHandler instead of a generic 500.
      max-file-size: 5MB
      max-request-size: 25MB
  messages:
    basename: messages
    encoding: UTF-8
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dangkhang16125@gmail.com}
    password: ${MAIL_PASSWORD:wnix siim nywx iuyt}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  hotel:
    timezone: Asia/Ho_Chi_Minh
    standard-check-in: "14:00"
    standard-check-out: "12:00"
  # Module 3A (GiapND, BR-19): how long a PENDING online reservation holds its
  # room quota before the scheduler auto-cancels it. Default 24h (SRS BR-19).
  # Override with env BOOKING_HOLD_HOURS (e.g. 1 for a demo) — never hardcode
  # a test value in the service code.
  booking:
    hold-hours: ${BOOKING_HOLD_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Room-type photo upload (FileStorageService + WebConfig /uploads/**).
  # dir is relative to the backend working directory; keep it outside the
  # deployable artifact so a redeploy never wipes uploaded photos.
  # Override with env UPLOAD_DIR (e.g. /var/hms/uploads on the server).
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-file-size: 5MB
  jwt:
    secret: ${JWT_SECRET:HMS_SBA301_GroupProject_SuperSecretKey_AtLeast256BitsLong_2026_FPT}
    access-token-expiration-ms: 900000       # 15 minutes (SDD 4.1.5.1)
    refresh-token-expiration-ms: 604800000   # 7 days (SDD 4.1.5.1)
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMO_TMN}
    hash-secret: ${VNPAY_HASH_SECRET:DEMO_SECRET}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:5173/booking/payment-callback

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
