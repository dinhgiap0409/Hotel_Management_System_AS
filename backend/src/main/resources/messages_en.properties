# Standardized Application Messages Catalogue (SDD Section 4.1.4 & SRS Section 6.3)
MSG01A=Email already exists. Please sign in or use another email.
MSG01B=Invalid email or password.
MSG01C=No available rooms found matching your criteria.
MSG02A=Your account is currently inactive or locked.
MSG03A=Current password is incorrect or new passwords do not match.
MSG04A=Check-out date must be after check-in date and check-in date cannot be in the past.
MSG05A=Room number already exists across the property.
MSG06A=Only Vacant and Inspected rooms can be assigned to guests.
MSG07A=Room under maintenance. Housekeeping update is not allowed.
MSG08A=The room is currently occupied.
MSG09=Invalid, expired, or ineligible promotional voucher code.
MSG_ROOMTYPE_HAS_ROOMS=Cannot deactivate this room type because physical rooms of this type have not been archived yet.
MSG_ROOM_HAS_ACTIVE_BOOKING=Cannot archive this room because it is assigned to an active stay or its room type has upcoming reservations.
MSG_INVALID_CLEANING_TRANSITION=Invalid housekeeping status transition. The order must be Dirty → Clean → Inspected; moving from Inspected back to Dirty requires a recorded reason.
MSG_TASK_ROOM_NOT_DIRTY=Cleaning tasks can only be assigned to rooms with Dirty cleaning status.
MSG_TASK_STAFF_INACTIVE=Cannot assign a task to an inactive staff member. Please choose another active staff member.
MSG_TASK_ASSIGNER_NOT_FOUND=The signed-in account has no staff record, so it cannot assign tasks.
MSG_INVALID_TASK_TYPE=Invalid task type. Only CLEANING or MAINTENANCE is accepted.
MSG_INVALID_TASK_PRIORITY=Invalid priority. Only LOW, NORMAL, HIGH or URGENT is accepted.
MSG_INVALID_TASK_TRANSITION=Invalid task status transition. The order must be ASSIGNED → IN_PROGRESS → COMPLETED; a task can only be CANCELLED while it is ASSIGNED or IN_PROGRESS.
MSG_TASK_UPDATE_FORBIDDEN=Only the assigned staff member, the housekeeping manager or an administrator can change this task's status.
MSG10=Outstanding folio balance must be settled (zero) before completing check-out.
MSG11=Service charges can only be posted to Checked-In stays.
MSG12A=Only Completed stays can be reviewed once.
MSG12B=Report start date must be on or before end date.
VALIDATION_ERROR=Input validation failed. Please check the highlighted fields.
RESOURCE_NOT_FOUND=The requested resource was not found.
AUTH_FORBIDDEN=You do not have permission to perform this action.
INTERNAL_ERROR=The system encountered a problem. Please retry, or give the trace code to the administrator.
