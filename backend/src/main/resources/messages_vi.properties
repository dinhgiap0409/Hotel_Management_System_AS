# Danh mục thông báo chuẩn hóa (SDD Section 4.1.4 & SRS Section 6.3)
MSG01A=Email đã tồn tại trong hệ thống. Vui lòng đăng nhập hoặc dùng email khác.
MSG01B=Email hoặc mật khẩu không chính xác.
MSG01C=Không tìm thấy phòng trống phù hợp với tiêu chí tìm kiếm.
MSG02A=Tài khoản của bạn hiện đang bị vô hiệu hóa hoặc tạm khóa.
MSG03A=Mật khẩu hiện tại không đúng hoặc mật khẩu xác nhận không khớp.
MSG04A=Ngày trả phòng phải sau ngày nhận phòng và ngày nhận phòng không được ở trong quá khứ.
MSG05A=Số phòng đã tồn tại trong khách sạn.
MSG06A=Chỉ được gán các phòng đang Trống (Vacant) và Đã kiểm tra (Inspected).
MSG07A=Phòng đang bảo trì. Không thể cập nhật trạng thái dọn phòng.
MSG08A=Phòng hiện đang có khách lưu trú (Occupied).
MSG09=Mã giảm giá không hợp lệ, đã hết hạn hoặc chưa đủ điều kiện áp dụng.
MSG10=Số dư công nợ (Folio balance) phải bằng 0 trước khi hoàn tất trả phòng (Check-out).
MSG11=Chỉ được ghi nhận phí dịch vụ cho các lượt lưu trú đã Check-in.
MSG12A=Chỉ các lượt lưu trú đã hoàn tất (Completed) mới được đánh giá 1 lần.
MSG12B=Ngày bắt đầu báo cáo phải nhỏ hơn hoặc bằng ngày kết thúc.
VALIDATION_ERROR=Dữ liệu nhập vào không hợp lệ. Vui lòng kiểm tra lại các trường báo đỏ.
RESOURCE_NOT_FOUND=Không tìm thấy dữ liệu yêu cầu.
AUTH_FORBIDDEN=Bạn không có quyền thực hiện chức năng này.
INTERNAL_ERROR=Hệ thống gặp sự cố. Vui lòng thử lại hoặc cung cấp mã lỗi cho quản trị viên.
