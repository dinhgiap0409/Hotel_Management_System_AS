# Danh mục thông báo chuẩn hóa Tiếng Việt (SDD Section 4.1.4 & SRS Section 6.3)
MSG01A=Email đã tồn tại trong hệ thống. Vui lòng đăng nhập hoặc dùng email khác.
MSG01B=Email hoặc mật khẩu không chính xác.
MSG01C=Không tìm thấy phòng trống phù hợp với tiêu chí tìm kiếm.
MSG02A=Tài khoản của bạn hiện đang bị vô hiệu hóa hoặc tạm khóa.
MSG03A=Mật khẩu hiện tại không đúng hoặc mật khẩu xác nhận không khớp.
MSG04A=Ngày trả phòng phải sau ngày nhận phòng và ngày nhận phòng không được ở trong quá khứ.
MSG05A=Số phòng đã tồn tại trong khách sạn.
MSG06A=Chỉ được gán các phòng đang Trống và Đã kiểm tra.
MSG07A=Phòng đang bảo trì. Không thể cập nhật trạng thái dọn phòng.
MSG08A=Phòng hiện đang có khách lưu trú.
MSG09=Mã giảm giá không hợp lệ, đã hết hạn hoặc chưa đủ điều kiện áp dụng.
MSG_ROOMTYPE_HAS_ROOMS=Không thể vô hiệu hóa hạng phòng vì vẫn còn phòng vật lý thuộc hạng này chưa được lưu trữ.
MSG_ROOM_HAS_ACTIVE_BOOKING=Không thể lưu trữ phòng vì phòng đang gắn với lượt lưu trú đang hoạt động hoặc có đặt phòng sắp tới của hạng phòng này.
MSG_INVALID_CLEANING_TRANSITION=Trạng thái vệ sinh không hợp lệ. Thứ tự phải là Dirty → Clean → Inspected; chuyển từ Inspected về Dirty cần ghi rõ lý do.
MSG_TASK_ROOM_NOT_DIRTY=Chỉ được giao nhiệm vụ dọn dẹp cho phòng đang ở trạng thái Dirty.
MSG_TASK_STAFF_INACTIVE=Không thể giao việc cho nhân viên không còn hoạt động. Vui lòng chọn nhân viên khác đang hoạt động.
MSG_TASK_ASSIGNER_NOT_FOUND=Tài khoản đang đăng nhập chưa có hồ sơ nhân viên nên không thể giao nhiệm vụ.
MSG_INVALID_TASK_TYPE=Loại nhiệm vụ không hợp lệ. Chỉ chấp nhận CLEANING hoặc MAINTENANCE.
MSG_INVALID_TASK_PRIORITY=Mức ưu tiên không hợp lệ. Chỉ chấp nhận LOW, NORMAL, HIGH hoặc URGENT.
MSG_INVALID_TASK_TRANSITION=Chuyển trạng thái nhiệm vụ không hợp lệ. Thứ tự phải là ASSIGNED → IN_PROGRESS → COMPLETED; chỉ được hủy (CANCELLED) khi nhiệm vụ còn ASSIGNED hoặc IN_PROGRESS.
MSG_TASK_UPDATE_FORBIDDEN=Chỉ nhân viên được giao nhiệm vụ, quản lý buồng phòng hoặc quản trị viên mới được đổi trạng thái nhiệm vụ này.
MSG10=Số dư công nợ phải bằng 0 trước khi hoàn tất trả phòng.
MSG11=Chỉ được ghi nhận phí dịch vụ cho các lượt lưu trú đã nhận phòng.
MSG12A=Chỉ các lượt lưu trú đã hoàn tất mới được đánh giá 1 lần.
MSG12B=Ngày bắt đầu báo cáo phải nhỏ hơn hoặc bằng ngày kết thúc.
VALIDATION_ERROR=Dữ liệu nhập vào không hợp lệ. Vui lòng kiểm tra lại các trường thông tin.
RESOURCE_NOT_FOUND=Không tìm thấy dữ liệu yêu cầu.
AUTH_FORBIDDEN=Bạn không có quyền thực hiện chức năng này.
INTERNAL_ERROR=Hệ thống gặp sự cố. Vui lòng thử lại hoặc cung cấp mã lỗi cho quản trị viên.
